%YAML:1.0
---
# =============================================================================
#  PongBot - configuración (se lee al arrancar; NO hace falta recompilar)
#  Unidades: cm, ms, cm/s.  Booleanos: 0 / 1.
#
#  Coordenadas de MESA (las da la homografía ArUco):
#    X = a lo largo de la mesa (de un robot al otro), Y = a lo ancho.
#  Coordenadas de ROBOT (cinemática de Valeria):
#    x = lateral (-izq, +der),  y = hacia delante desde la base.
#  Para cada brazo:  u = side * X_mesa   (u crece cuando la bola se acerca a él)
# =============================================================================

camera:
   index: 2                     # en el PC del lab la cámara cenital era la 2
   width: 640
   height: 480
   fps: 30
   calibration_file: "./data/camera_calibration_params.xml"
   undistort: 1

vision:
   color_file: "./data/color_params_data.xml"   # se genera con ./bin/hsv_tuner
   min_ball_area: 150
   min_circularity: 0.70
   flip_x: 0
   flip_y: 0
   # Centros de los ArUco (cm): TL, TR, BL, BR tal como se ven en la imagen
   markers: [ -20.4, 8.15,  20.4, 8.15,  -20.4, -8.15,  20.4, -8.15 ]
   table_half_width: 10.8       # MEDIDO 17/11: Y del centro de la bola tocando la pared lateral
   table_half_length: 35.0      # solo dibujo / simulación (pala a 32.5 cm del centro)
   velocity_alpha: 0.5          # suavizado de velocidad (1 = sin suavizar)
   lost_timeout_s: 0.3
   predict: 1                   # IA: ir al punto de intercepción (0 = seguir Y)

game:
   points_to_win: 5
   auto_goals: 1                # goles automáticos por visión
   goal_frames: 3               # frames seguidos detrás de la línea de gol
   rearm_center_u: 15.0         # tras un gol, la bola debe volver a |X| < esto
   scores_file: "data/scores.csv"

# -----------------------------------------------------------------------------
#  Brazos. El PRIMERO es el de P1, el SEGUNDO el de P2.
#  ids: [base, hombro(fijo), codo, muñeca]
#  dir: sentido de giro [base, codo, muñeca]  (ticks = 512 + dir*grados*1023/300 + offset)
# -----------------------------------------------------------------------------
arms:
   -
      name: "A"
      enabled: 1
      # U2D2 del brazo A (nombre fijo; antes ttyUSB0/1 se intercambiaban al reconectar)
      port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT4TFLHO-if00-port0"
      baudrate: 1000000
      ids: [ 1, 2, 3, 4 ]
      shoulder_ticks: 341
      dir: [ 1, -1, -1 ]          # convención probada en la mesa (Valeria)
      offset: [ 0, 0, 0 ]
      tick_min: [ 0, 0, 0 ]
      tick_max: [ 1023, 1023, 1023 ]
      links: [ 5.0, 5.5, 6.3 ]    # L1, L2, L3
      gamma: 0.0
      side: 1                     # el brazo A está en el extremo +X
      lateral_sign: 1             # target_x = ball_Y (lo que funcionó)
      lateral_center: 0.0
      lateral_limit: 7.0
      lateral_min: -6.0           # probado 17/11: sin choque
      lateral_max: 7.0
      home_y: 13.5
      recoil_y: 10.5              # 17/11: más retroceso = más impulso
      strike_y: 16.5              # 17/11: hasta el máximo; se reduce solo donde no alcanza
      recoil_ms: 90
      strike_ms: 150
      return_ms: 80
      cooldown_ms: 200
      paddle_u: 30.8              # MEDIDO 17/11: X de la bola tocando la pala en home
      smash_trigger_u: 29.8       # 17/11: con 27 el smash salía antes de tiempo (pronto -> subir, tarde -> bajar)
      smash_min_speed: 4.5        # antes: velocity_x > 0.15 cm/frame (= 4.5 cm/s)
      smash_lead_s: 0.12          # anticipación según la velocidad de la bola
      smash_lateral_window: 4.0
      goal_u: 34.5                # pala a 32.5 cm + radio de la bola
      min_send_ms: 8
      max_lateral_speed: 60.0     # cm/s; evita saltos bruscos (errores ID 4). 0 = sin límite
      write_gap_us: 1000          # pausa entre motores; si hay errores de comunicación subir a 3000
   -
      name: "B"
      enabled: 1
      # Si el brazo B está en el MISMO U2D2 que A: port "/dev/ttyUSB0" e ids distintos (p.ej. 5-8)
      port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT9MIQP7-if00-port0"   # U2D2 del brazo B
      baudrate: 1000000
      ids: [ 1, 2, 3, 4 ]
      shoulder_ticks: 231         # MEDIDO 17/11 (el B está montado distinto que el A)
      dir: [ 1, -1, -1 ]          # si algún motor gira al revés, cambiar su signo aquí
      offset: [ 0, 0, 0 ]
      tick_min: [ 0, 0, 0 ]
      tick_max: [ 1023, 1023, 1023 ]
      links: [ 5.0, 5.5, 6.3 ]    # MEDIR el brazo B
      gamma: 0.0
      side: -1                    # el brazo B está en el extremo -X (enfrente)
      lateral_sign: -1            # mirando al revés => ball_Y se invierte
      lateral_center: -0.3        # MEDIDO 17/11: Y de la bola delante del centro de la pala
      lateral_limit: 7.0
      lateral_min: -5.5           # 17/11: ajustado en la mesa (-4.3 y -5.0 dejaban demasiado espacio)
      lateral_max: 7.0
      home_y: 13.5
      recoil_y: 10.5              # 17/11: más retroceso = más impulso
      strike_y: 16.5              # 17/11: hasta el máximo; se reduce solo donde no alcanza
      recoil_ms: 90
      strike_ms: 150
      return_ms: 80
      cooldown_ms: 200
      paddle_u: 29.9              # MEDIDO 17/11: bola tocando la pala del B en X = -29.9
      smash_trigger_u: 28.9       # 17/11: con 27 el smash salía antes de tiempo (pronto -> subir, tarde -> bajar)
      smash_min_speed: 4.5
      smash_lead_s: 0.12          # anticipación según la velocidad de la bola
      smash_lateral_window: 4.0
      goal_u: 34.5                # pala a 32.5 cm + radio de la bola
      min_send_ms: 8
      max_lateral_speed: 60.0     # cm/s; evita saltos bruscos (errores ID 4). 0 = sin límite
      write_gap_us: 3000          # la muñeca (ID 4) del B perdía paquetes con 1000

# -----------------------------------------------------------------------------
#  Joysticks (Arduino, 115200 baudios). Formatos de línea aceptados:
#    "x,y,btn"  (sketch de Valeria: arduino/arduino_joystick, botón en pin 2)
#    "x,y"  /  "x1,y1,x2,y2"  /  "x1,y1,b1,x2,y2,b2"
#  Smash = botón pulsado  O  eje Y > smash_threshold (0 = desactivar el eje).
#  El primero es P1, el segundo P2. Un solo Arduino con 2 sticks:
#  mismo device y channel 0 / 1.  device "none" = solo teclado.
# -----------------------------------------------------------------------------
joysticks:
   -
      device: "/dev/serial/by-id/usb-Arduino__www.arduino.cc__0043_5573232363035181B160-if00"
      channel: 0
      center: 512
      deadzone_low: 450
      deadzone_high: 570
      full_scale: 450
      smash_threshold: 800
      invert_x: 0
      invert_y: 0
      max_speed: 30.0
   -
      device: "/dev/serial/by-id/usb-Arduino__www.arduino.cc__0043_5573232363035181B160-if00"        # 17/11: los 2 joysticks en el mismo Arduino (arduino_joystick_dual)
      channel: 1
      # 17/11: este joystick está alimentado a 3.3 V -> centro ~337, máximo ~675
      center: 337
      deadzone_low: 300
      deadzone_high: 375
      full_scale: 290
      smash_threshold: 560        # a 3.3 V el eje llega a ~675 (no a 1023)
      invert_x: 0
      invert_y: 0                 # poner 1 si el smash sale al tirar hacia ATRÁS
      max_speed: 30.0
